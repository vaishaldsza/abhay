<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Record Removed or Not Found | Abhay DDMA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col">
  {% include "nav.html" %}

  <main class="flex-1 flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm p-8 text-center space-y-4">
      <div class="w-16 h-16 bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 rounded-full flex items-center justify-center mx-auto">
        <span class="material-symbols-outlined text-3xl">search_off</span>
      </div>
      
      <div class="space-y-1">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">HTTP 404</span>
        <h1 class="text-xl font-bold text-slate-900 dark:text-slate-100">Record removed or not found</h1>
        <p class="text-sm text-slate-600 dark:text-slate-300 pt-1 leading-relaxed">
          The requested household or call intake record has been removed, purged under DPDP privacy retention policies, or does not exist.
        </p>
      </div>

      <div class="pt-4 flex flex-col sm:flex-row gap-2 justify-center">
        <a href="/call-floor" class="inline-flex items-center justify-center gap-1.5 px-4 py-2 bg-[#0B2545] hover:bg-[#133968] text-white text-sm font-semibold rounded-lg shadow-sm transition">
          <span class="material-symbols-outlined text-base">support_agent</span>
          <span>View Call Floor</span>
        </a>
        <a href="/dashboard" class="inline-flex items-center justify-center gap-1.5 px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 text-sm font-semibold rounded-lg transition">
          <span class="material-symbols-outlined text-base">dashboard</span>
          <span>Dashboard</span>
        </a>
      </div>
    </div>
  </main>
</body>
</html>
